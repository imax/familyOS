app = "familyos"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/family.db"
  FAMILY_YAML = "/app/family.yaml"
  TZ = "Europe/Kyiv"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # otherwise the bot and the morning job go to sleep too
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
