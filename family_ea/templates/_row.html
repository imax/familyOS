<li class="{{ r.kind }}">
  <span class="time{% if r.all_day %} allday{% endif %}">{{ r.time }}</span>
  <span>
    {%- if r.kind == 'commitment' %}<span class="mark">☐</span>{% elif r.kind == 'reminder' %}<span class="mark">⏰</span>{% endif -%}
    {{ r.text }}
    {%- if r.ics_url %} <a class="ical" href="{{ r.ics_url }}" title="в календар (.ics)">📅</a>{% endif %}
    {%- set meta = [r.note, r.who] | select | join(' · ') %}
    {%- if meta %} <span class="meta">· {{ meta }}</span>{% endif %}
  </span>
</li>
