<li class="status-{{ e.status }}">
  <span class="id">#{{ e.id }}</span><b>{{ e | when }}</b> {{ e.text }}
  <a class="ical" href="/events/{{ e.id }}.ics" title="в календар (.ics)">📅</a>
  <div class="meta">
    {% if e.who %}{{ e.who | person }} · {% endif %}
    {{ e.created_by | person }}, {{ e.created_at | dt }}
    {% if e.status != 'planned' %} · {{ e.status }}{% endif %}
  </div>
</li>
